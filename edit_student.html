<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Student - EduQuantra SMS</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: #141416; min-height: 100vh; display: flex; align-items: center; }
        .edit-card { background: #FFFFFF; border-radius: 20px; padding: 2rem; width: 100%; max-width: 520px; margin: auto; }
        .quantra-input { border-radius: 10px; border: 1px solid #E4E4E7; padding: 0.55rem 0.85rem; }
    </style>
</head>
<body>
<div class="edit-card shadow-lg">
    <h5 class="fw-bold mb-1">Edit Student Record</h5>
    <p class="text-muted small mb-4">Updating profile for <strong>{{ student.name }}</strong></p>
    <form method="post">
        {% csrf_token %}
        {% for field in form %}
            <div class="mb-3">
                <label class="form-label small fw-semibold text-secondary">{{ field.label }}</label>
                {{ field }}
                {% if field.errors %}
                    <div class="text-danger small">{{ field.errors|striptags }}</div>
                {% endif %}
            </div>
        {% endfor %}
        <div class="d-flex justify-content-between mt-4">
            <a href="{% url 'dashboard' %}" class="btn btn-light border px-4" style="border-radius:10px;">Cancel</a>
            <button type="submit" class="btn btn-dark px-4 fw-semibold" style="border-radius:10px;">Save Changes</button>
        </div>
    </form>
</div>
</body>
</html>
