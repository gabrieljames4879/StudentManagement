<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - EduQuantra SMS</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #141416;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-card {
            background: #1C1C1F;
            border: 1px solid #2C2C31;
            border-radius: 20px;
            width: 100%;
            max-width: 420px;
            padding: 2.5rem;
            box-shadow: 0 24px 48px rgba(0, 0, 0, 0.45);
        }
        .brand-icon {
            width: 46px;
            height: 46px;
            border-radius: 12px;
            background: linear-gradient(135deg, #FF7A00, #FFB800);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            color: #141416;
            font-size: 1.4rem;
            font-weight: 700;
        }
        .form-control {
            background: #252529;
            border: 1px solid #35353B;
            color: #ffffff;
            border-radius: 10px;
            padding: 0.65rem 0.9rem;
        }
        .form-control:focus {
            background: #252529;
            border-color: #FF7A00;
            color: #ffffff;
            box-shadow: 0 0 0 0.2rem rgba(255, 122, 0, 0.2);
        }
        .btn-accent {
            background: linear-gradient(135deg, #FF7A00, #FFA800);
            border: none;
            color: #141416;
            font-weight: 700;
            border-radius: 10px;
            padding: 0.7rem;
            transition: opacity 0.2s;
        }
        .btn-accent:hover {
            opacity: 0.92;
            color: #141416;
        }
    </style>
</head>
<body>

<div class="login-card">
    <div class="text-center mb-4">
        <div class="brand-icon mb-3"><i class="bi bi-bar-chart-fill"></i></div>
        <h4 class="fw-bold mb-1">EduQuantra SMS</h4>
        <p class="text-secondary small mb-0">Sign in to the Student Management Dashboard</p>
    </div>

    {% if form.errors %}
        <div class="alert alert-danger py-2 small border-0 bg-danger bg-opacity-25 text-danger">
            Invalid username or password.
        </div>
    {% endif %}

    <form method="post">
        {% csrf_token %}
        <div class="mb-3">
            <label class="form-label small text-secondary fw-semibold">Username</label>
            <input type="text" name="username" class="form-control" placeholder="Enter admin username" required autofocus>
        </div>
        <div class="mb-4">
            <label class="form-label small text-secondary fw-semibold">Password</label>
            <input type="password" name="password" class="form-control" placeholder="Enter password" required>
        </div>
        <button type="submit" class="btn btn-accent w-100">Sign In to Dashboard</button>
    </form>
</div>

</body>
</html>
